; 模块从 AgentPanelBridge / AgentPanelBridgeEditor 改名成 UELinkCore / UELinkEditor 后，
; 项目里继承 UAgentPanelGMLibrary 的蓝图、引用这些类的资源还记着旧的脚本包路径，这里重定向过去，不用重存资源
[CoreRedirects]
+PackageRedirects=(OldName="/Script/AgentPanelBridge",NewName="/Script/UELinkCore")
+PackageRedirects=(OldName="/Script/AgentPanelBridgeEditor",NewName="/Script/UELinkEditor")
