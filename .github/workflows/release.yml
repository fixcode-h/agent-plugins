# 推到 main：检查、构建所有插件，每个插件的包发到 Release（标签 <id>-v<版本>，附件 <id>-<版本>.zip 和校验文件 .zip.sha256）。
# 同一个版本的 Release 已经有了：包的内容一样就跳过；不一样也不覆盖（同一版本号两份内容，用户装到的东西对不上，
# 更新检查也查不出来），只出警告提醒升版本号。要让用户收到升级，改 plugin.json 和 plugins.json 的版本号。
# 拉取请求只检查和构建，不发布。
name: 构建与发布

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 照面板源码布局放文件的插件（ui-design）类型和单测要用面板的源码：浅克隆面板 dev 分支到 .panel 再装依赖
      - name: 准备面板源码（.panel）
        run: npm run panel
      - name: 检查（类型、漏翻、插件目录）
        run: npm run check
      - name: 构建插件包
        run: npm run build
      - name: 冒烟测试（不需要 Blender）
        run: node blender/scripts/smoke.mjs
      - name: UE 冒烟测试（假的桥接，不需要 UE）
        run: node ue/scripts/smoke.mjs
      - name: UE 性能抓取解析器测试（CSV、memreport）
        run: node ue/scripts/perf-test.mjs
      - name: UE 对象页 / 资源页导航历史、文件夹树单测
        run: node --test ue/web/inspect/nav-state.test.ts ue/server/asset-folders.test.ts ue/server/asset-folders-stat.test.ts ue/server/favorites.test.ts ue/web/jump/keys.test.ts ue/web/jump/index-match.test.ts ue/server/search-index/search-index.test.ts ue/server/uekit/forge-watch.test.ts ue/server/uekit/forge-edited.test.ts ue/web/sections/uekit/forge-doc.test.ts ue/web/sections/uekit/forge-preview-props.test.ts ue/web/sections/uekit/gt-tidy-diff.test.ts ue/server/uekit/gt-tidy.test.ts ue/server/vs-debug/vs-debug.test.ts ue/server/vs-debug/open-vs.test.ts ue/web/vs-debug/model.test.ts ue/server/lua/unlua-detect.test.ts ue/shared/gt-script/gt-script.test.ts ue/shared/gt-script/cond-expr.test.ts ue/web/sections/uekit/gt-guards/model.test.ts ue/web/sections/uekit/gt-flow/layout.test.ts ue/web/sections/uekit/gt-flow/bp/graph.test.ts ue/web/sections/uekit/gt-flow/run-state.test.ts ue/web/sections/uekit/gt-debug/run-log.test.ts ue/web/sections/uekit/gt-blocks/state-presets.test.ts ue/web/sections/uekit/gt-blocks/subgraph-swap.test.ts ue/web/sections/uekit/gt-rows/rows.test.ts ue/web/sections/uekit/gt-step-history.test.ts ue/web/sections/uekit/gt-key-batch.test.ts ue/shared/asset-diff/diff.test.ts ue/server/batch/targets.test.ts ue/server/python-run.test.ts ue/web/inspect/layouts/layouts.test.ts ue/web/inspect/layouts/umg/umg.test.ts ue/web/inspect/layouts/blueprint/blueprint.test.ts ue/web/inspect/layouts/blueprint/ue-style.test.ts ue/web/inspect/layouts/datatable/datatable.test.ts ue/web/inspect/layouts/dataasset/data-layouts.test.ts ue/web/inspect/layouts/curve/curve.test.ts ue/web/timeline/timeline.test.ts ue/server/uekit/forge-section.test.ts ue/shared/forge-doc/forge-doc.test.ts ue/shared/umg-schema/umg-schema.test.ts ue/web/inspect/layouts/umg/edit/node-props.test.ts ue/web/sections/uekit/forge-markup/markup.test.ts ue/web/inspect/layouts/preview/preview.test.ts ue/web/inspect/layouts/material/material.test.ts ue/web/inspect/layouts/skeletal/skeletal.test.ts ue/web/inspect/layouts/umg/view.test.ts ue/web/inspect/layouts/umg/subref/subref.test.ts
      - name: UI 设计单测（面板模块取自 .panel）
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: |
            dist/*.zip
            dist/*.zip.sha256
      - name: 发到 Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "for (const b of require('./dist/built.json')) console.log(b.id, b.version, b.asset)" |
          while read -r id version asset; do
            tag="${id}-v${version}"
            if gh release view "$tag" >/dev/null 2>&1; then
              old=""
              if gh release download "$tag" -p "$asset" -D .old-release --clobber >/dev/null 2>&1; then
                old=$(sha256sum ".old-release/$asset" | cut -d' ' -f1)
              fi
              new=$(cut -d' ' -f1 "dist/$asset.sha256")
              if [ "$old" = "$new" ]; then
                # 内容没变：只补上旧 Release 没有的校验文件
                gh release upload "$tag" "dist/$asset.sha256" --clobber
              elif [ -z "$old" ]; then
                gh release upload "$tag" "dist/$asset" "dist/$asset.sha256"
              else
                echo "::warning::$id $version 的包内容变了但版本号没变，Release 没有覆盖；要发布这次改动请升 $id 的版本号"
              fi
            else
              prerelease=""
              case "$version" in *-*) prerelease="--prerelease" ;; esac
              gh release create "$tag" "dist/$asset" "dist/$asset.sha256" --target "$GITHUB_SHA" --title "$id $version" \
                --notes "插件 $id $version。在 Agent 面板「设置 → 插件」的插件市场里安装，或下载 $asset 后选「从压缩包安装」。" $prerelease
            fi
          done
