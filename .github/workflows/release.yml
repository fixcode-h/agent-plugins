# 推到 main：检查、构建所有插件，每个插件的包发到 Release（标签 <id>-v<版本>，附件 <id>-<版本>.zip 和校验文件 .zip.sha256）。
# 同一个版本的 Release 已经有了：包的内容一样就跳过；不一样也不覆盖（同一版本号两份内容，用户装到的东西对不上，
# 更新检查也查不出来），只出警告提醒升版本号。要让用户收到升级，改 plugin.json 和 plugins.json 的版本号。
# 拉取请求只检查和构建，不发布。
name: 构建与发布

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # 照面板源码布局放文件的插件（ui-design）类型和单测要用面板的源码：浅克隆面板 dev 分支到 .panel 再装依赖
      - name: 准备面板源码（.panel）
        run: npm run panel
      - name: 检查（类型、漏翻、插件目录）
        run: npm run check
      - name: 构建插件包
        run: npm run build
      - name: 冒烟测试（不需要 Blender）
        run: node blender/scripts/smoke.mjs
      - name: UE 冒烟测试（假的桥接，不需要 UE）
        run: node ue/scripts/smoke.mjs
      - name: UE 性能抓取解析器测试（CSV、memreport）
        run: node ue/scripts/perf-test.mjs
      - name: UI 设计单测（面板模块取自 .panel）
        run: npm test
      - uses: actions/upload-artifact@v4
        with:
          name: plugins
          path: |
            dist/*.zip
            dist/*.zip.sha256
      - name: 发到 Release
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          node -e "for (const b of require('./dist/built.json')) console.log(b.id, b.version, b.asset)" |
          while read -r id version asset; do
            tag="${id}-v${version}"
            if gh release view "$tag" >/dev/null 2>&1; then
              old=""
              if gh release download "$tag" -p "$asset" -D .old-release --clobber >/dev/null 2>&1; then
                old=$(sha256sum ".old-release/$asset" | cut -d' ' -f1)
              fi
              new=$(cut -d' ' -f1 "dist/$asset.sha256")
              if [ "$old" = "$new" ]; then
                # 内容没变：只补上旧 Release 没有的校验文件
                gh release upload "$tag" "dist/$asset.sha256" --clobber
              elif [ -z "$old" ]; then
                gh release upload "$tag" "dist/$asset" "dist/$asset.sha256"
              else
                echo "::warning::$id $version 的包内容变了但版本号没变，Release 没有覆盖；要发布这次改动请升 $id 的版本号"
              fi
            else
              prerelease=""
              case "$version" in *-*) prerelease="--prerelease" ;; esac
              gh release create "$tag" "dist/$asset" "dist/$asset.sha256" --target "$GITHUB_SHA" --title "$id $version" \
                --notes "插件 $id $version。在 Agent 面板「设置 → 插件」的插件市场里安装，或下载 $asset 后选「从压缩包安装」。" $prerelease
            fi
          done
